    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _origFetch; },
            set: function(fn) { _origFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        var isExtError = function(msg, file, stack) {
          var str = ((msg || '') + ' ' + (file || '') + ' ' + (stack || '')).toLowerCase();
          return str.indexOf('cannot set property fetch') !== -1 ||
                 str.indexOf('fetch of #<window>') !== -1 ||
                 str.indexOf('chrome-extension:') !== -1 ||
                 str.indexOf('moz-extension:') !== -1 ||
                 str.indexOf('frame_ant') !== -1;
        };

        window.addEventListener('error', function(e) {
          if (isExtError(e.message, e.filename, e.error && e.error.stack)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason;
          var msg = r instanceof Error ? r.message : String(r || '');
          var stack = r && r.stack ? r.stack : '';
          if (isExtError(msg, '', stack)) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
    <title>La Boîte à Merveilles - قراءة وترجمة تفاعلية لأولى باك</title>
